	<template id="toggle-switch-template">
		<style>
			@property --toggle-switch-width {
				syntax: "<length>";
				inherits: false;
			}

			:root {
				--toggle-switch-width: 25%;
			}

			.toggle_button {
				--tgl-w: var(--toggle-switch-width);
				--tgl-h: calc(var(--tgl-w) * 35 / 75);
				--tgl-r: calc(var(--tgl-w) * 40 / 75);

				position: relative;
				width: var(--tgl-w);
				height: var(--tgl-h);
				margin: auto;

				&>.toggle_input {
					position: absolute;
					width: 100%;
					height: 100%;
					opacity: 0;
					cursor: pointer;

					&+.toggle_label {
						width: var(--tgl-w);
						height: var(--tgl-h);
						background-color: #ccc;
						border-radius: var(--tgl-r);
						display: inline-block;
						transition: background-color 0.5s;
						position: relative;

						&::after {
							content: "";
							position: absolute;
							width: var(--tgl-h);
							height: var(--tgl-h);
							background-color: #fff;
							border-radius: 50%;
							top: 0;
							left: 0;
							transition: left 0.4s;
						}
					}

					&:checked+.toggle_label {
						background-color: #4BD865;

						&::after {
							left: var(--tgl-r);
						}
					}
				}
			}
		</style>
		<div class="toggle_button">
			<input id="toggle" class="toggle_input" type="checkbox" />
			<label for="toggle" class="toggle_label"></label>
		</div>
	</template>
	<template id="display-template">
		<style>
			.display-item-box {
				width: 100%;
				height: 100%;
			}

			.contents {
				width: 100%;
			}

			.main-contents {
				height: 80%;
			}

			.sub-contents {
				height: 10%;
			}

			.corner-box {
				width: 20%;
				height: 100%;
			}


			#corner-00 {
				border-radius: 999em 0 0 0;
			}

			#corner-10 {
				border-radius: 0 999em 0 0;
			}

			#corner-11 {
				border-radius: 0 0 999em 0;
			}

			#corner-01 {
				border-radius: 0 0 0 999em;
			}

			iframe {
				aspect-ratio: 1/1;
				width: 75%;
				height: 75%;
			}
		</style>
		<div class="display-item-box">
			<header class="contents sub-contents">
				<div class="item-box">
					<div class="corner-box left-corner icon-box">
						<div id="corner-00"></div>
						<div id="icon-box">
							<iframe></iframe>
						</div>
					</div>
					<div class="text-box header-text">
						<div id="text-box"></div>
					</div>
					<div class="corner-box right-corner control-box">
						<div id="control-box"></div>
						<div id="corner-10"></div>
					</div>
				</div>
			</header>
			<div class="contents main-contents"></div>
			<footer class="contents sub-contents">
				<div class="item-box">
					<div class="corner-box left-corner">
						<div id="corner-01"></div>
						<div></div>
					</div>
					<div class="text-box footer-text">
						<div id="text-box"></div>
					</div>
					<div class="corner-box right-corner">
						<div></div>
						<div id="corner-11"></div>
					</div>
				</div>
			</footer>
		</div>
	</template>
