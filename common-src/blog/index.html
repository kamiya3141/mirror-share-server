	<meta name="description" content="">

<body class="desktop">
	<template id="toggle-switch">
		<style>
			@property --toggle-switch-width {
				syntax: "<length>";
				inherits: false;
			}

			:root {
				--toggle-switch-width: 25%;
			}

			.toggle_button {
				--tgl-w: var(--toggle-switch-width);
				--tgl-h: calc(var(--tgl-w) * 35 / 75);
				--tgl-r: calc(var(--tgl-w) * 40 / 75);

				position: relative;
				width: var(--tgl-w);
				height: var(--tgl-h);
				margin: auto;

				&>.toggle_input {
					position: absolute;
					width: 100%;
					height: 100%;
					opacity: 0;
					cursor: pointer;

					&+.toggle_label {
						width: var(--tgl-w);
						height: var(--tgl-h);
						background-color: #ccc;
						border-radius: var(--tgl-r);
						display: inline-block;
						transition: background-color 0.5s;
						position: relative;

						&::after {
							content: "";
							position: absolute;
							width: var(--tgl-h);
							height: var(--tgl-h);
							background-color: #fff;
							border-radius: 50%;
							top: 0;
							left: 0;
							transition: left 0.4s;
						}
					}

					&:checked+.toggle_label {
						background-color: #4BD865;

						&::after {
							left: var(--tgl-r);
						}
					}
				}
			}
		</style>
		<div class="toggle_button">
			<input id="toggle" class="toggle_input" type="checkbox" />
			<label for="toggle" class="toggle_label"></label>
		</div>
	</template>
	<span id="console-ok"></span>
	<!--script defer src="https://ld.tshuto.com/loading.js?2"></script-->
