<svg id="parent-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" style="background-color: rgba(0, 0, 0, 1);">
	<style>
		:root {
			--mainStrokeColor: white;
		}

		.text-class {
			fill: var(--mainStrokeColor);
			font-size: 500%;
		}

		#base-rect {
			fill: rgba(0, 0, 0, 0);
			stroke: var(--mainStrokeColor);
			transform: translate(-45%, -45%);
		}
	</style>
	<rect id="base-rect" x="50%" y="50%" width="90%" height="90%"></rect>
	<text class="text-class" x="50%" y="50%" text-anchor="middle" lengthAdjust="spacing">画像を表示できません。</text>
</svg>