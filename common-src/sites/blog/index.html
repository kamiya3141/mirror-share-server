<!doctype html>
<html lang="ja">

<head>
	<meta charset="utf-8">
	<title>ブログ - TSHUTO</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="このサイトはTSHUTO.COMのブログサイトです">
	<meta name="color-scheme" content="dark light">
	<link rel="stylesheet" crossorigin="anonymous" href="https://unpkg.com/font-awesome@latest/css/font-awesome.min.css">
	<link rel="stylesheet" href="https://css.tshuto.com/base.css">
	<link rel="stylesheet" href="./src/css/style.css">
	<link rel="stylesheet" href="./src/css/markdown.css">
	<link rel="stylesheet" href="./src/css/toggle-switch-template.css">
	<link rel="stylesheet" href="./src/css/display-template.css">
	<link rel="stylesheet" href="./src/css/display-setting-template.css">
	<link rel="stylesheet" href="./src/css/display-alert-template.css">
	<link rel="stylesheet" href="./src/css/display-confirm-template.css">
	<link rel="stylesheet" href="./src/css/all-articles-display.css">
	<link rel="stylesheet" href="./src/css/create-new-article-setting.css">
	<link rel="stylesheet" href="./src/css/edit-article-display.css">

	<!--
	<script defer src="https://share.tshuto.com/All.js"></script>
	-->
</head>

<body>
	<!--
	<script defer src="https://ld.tshuto.com/loading.js?2"></script>
	-->
	<template id="toggle-switch-template">
		<label class="toggle_button">
			<input class="toggle_input" type="checkbox" />
			<span class="toggle_label"></span>
		</label>
	</template>
	<template id="display-template">
		<div class="display-item-box">
			<header class="contents sub-contents">
				<div class="item-box">
					<div class="corner-box left-corner icon-box">
						<div class="corner" id="corner-00"></div>
						<div class="item" id="icon-box">
							<iframe></iframe>
						</div>
					</div>
					<div class="text-box header-text">
						<div id="text-box"></div>
					</div>
					<div class="corner-box right-corner control-box">
						<div class="item deco-text" id="control-box">
							<div>&#10005;</div>
						</div>
						<div class="corner" id="corner-10"></div>
					</div>
				</div>
			</header>
			<div class="contents main-contents"></div>
			<footer class="contents sub-contents">
				<div class="item-box">
					<div class="corner-box left-corner">
						<div class="corner" id="corner-01"></div>
						<div class="item"></div>
					</div>
					<div class="text-box footer-text">
						<div id="text-box"></div>
					</div>
					<div class="corner-box right-corner">
						<div class="item"></div>
						<div class="corner" id="corner-11"></div>
					</div>
				</div>
			</footer>
		</div>
	</template>
	<!--
	
	以下特殊用途のtemplate
	
	-->
	<template id="display-setting-template">
		<div id="display-setting-main-contents-setting">
			<div class="tab-bar">
				<div class="tab-bar--contents--box">
					<div class="tab-bar--contents" id="tb--appearance">
						<div class="tab-bar--contents--item text-overflow-element">表示設定</div>
					</div>
					<div class="tab-bar--contents" id="tb--specific">
						<div class="tab-bar--contents--item text-overflow-element">詳細設定</div>
					</div>
					<div class="tab-bar--contents" id="tb--user-data">
						<div class="tab-bar--contents--item text-overflow-element">ユーザデータの設定</div>
					</div>
					<div class="tab-bar--contents" id="tb--reset--setting-data">
						<div class="tab-bar--contents--item text-overflow-element">設定の初期化</div>
					</div>
				</div>
			</div>
			<div class="tab-contents-box">
				<div class="tab-contents-box--item" id="tc--appearance">
					<div class="item-all-box">
						<div class="item-summary">テーマの設定</div>
						<div class="item-box">
							<div class="item">
								<select id="setting-display--appearance--input-select--theme-setting" class="allow-expand" data-mydef--set-by-script="false"></select>
							</div>
						</div>
					</div>
					<div class="item-all-box">
						<div class="item-summary">デバイスモードの設定</div>
						<div class="item-box">
							<div class="item">
								<select id="setting-display--appearance--input-select--device-mode-setting" class="allow-expand" data-mydef--set-by-script="false"></select>
							</div>
						</div>
					</div>
					<div class="item-all-box">
						<div class="item-summary">好みの色の設定</div>
						<div class="item-box">
							<div class="item">
								<input type="color" id="setting-display--appearance--input-color--prefer-color" class="allow-expand">
							</div>
						</div>
					</div>
					<div class="item-all-box">
						<div class="item-summary">設定されたテーマの強制</div>
						<div class="item-box">
							<div class="item import-template-append" template-id-data="toggle-switch-template" template-id-args="force-theme"></div>
						</div>
					</div>
					<div class="item-all-box">
						<div class="item-summary">設定されたデバイスモードの強制</div>
						<div class="item-box">
							<div class="item import-template-append" template-id-data="toggle-switch-template" template-id-args="force-device"></div>
						</div>
					</div>
					<div class="item-all-box">
						<div class="item-summary">画面サイズによってデバイスモードの最適化を実行</div>
						<div class="item-box">
							<div class="item import-template-append" template-id-data="toggle-switch-template" template-id-args="allow--changing--device-mode--for--display-size"></div>
						</div>
					</div>
				</div>
				<div class="tab-contents-box--item" id="tc--specific">
					<div class="item-all-box">
						<div class="item-summary">設定画面の既定値</div>
						<div class="item-box">
							<div class="item">
								<select id="setting-display--specific--input-select--setting-display-init-item" class="allow-expand" data-mydef--set-by-script="false"></select>
							</div>
						</div>
					</div>
					<div class="item-all-box">
						<div class="item-summary">設定画面をリロード後に開くことを許可</div>
						<div class="item-box">
							<div class="item import-template-append" template-id-data="toggle-switch-template" template-id-args="allow--opening--setting-display--after--reload"></div>
						</div>
					</div>
				</div>
				<div class="tab-contents-box--item" id="tc--user-data">
					<div class="item-all-box">
						<div class="item-summary">ローカルストレージに設定を保存する</div>
						<div class="item-box">
							<div class="item import-template-append" template-id-data="toggle-switch-template" template-id-args="save--user-data--localstorage"></div>
						</div>
					</div>
				</div>
				<div class="tab-contents-box--item" id="tc--reset--setting-data"></div>
			</div>
		</div>
	</template>
	<template id="display-alert-template">
		<div id="display-alert-main-contents-alert">
			<div class="alert--main-contents-box">
				<div class="main-contents--top">
					<h1 id="alert--message"></h1>
				</div>
				<div class="main-contents--bottom">
					<div class="button-box">
						<input type="button" value="OK" id="alert--ok-button">
					</div>
				</div>
			</div>
		</div>
	</template>
	<template id="display-confirm-template">
		<div id="display-confirm-main-contents-confirm">
			<div class="confirm--main-contents-box">
				<div class="main-contents--top">
					<h1 id="confirm--message"></h1>
				</div>
				<div class="main-contents--bottom">
					<div class="button-box">
						<input type="button" value="CANCEL" id="confirm--cancel-button">
						<input type="button" value="OK" id="confirm--ok-button">
					</div>
				</div>
			</div>
		</div>
	</template>
	<template id="all-articles-display-template">
		<div id="all-articles-main-contents">
			<div class="type-search--input--box">
				<input type="search" placeholder="検索ワードを入力" id="main--input--type-search">
			</div>
			<div class="article-contents--box">

			</div>
		</div>
	</template>
	<template id="create-new-article-setting-template">
		<div id="create-new-article-main-contents">

		</div>
	</template>
	<template id="edit-article-display-template">
		<div id="edit-article-main-contents" data-mydef--edit-article--new-data="false">
			<div class="control--box">
				<div class="button-div--box">
					<div class="extra-space"></div>
					<div class="button-div">
						<input type="button" value="バックアップ保存" id="edit-article-display--input--button--backup">
					</div>
					<div class="button-div">
						<input type="button" value="下書き保存" id="edit-article-display--input--button--draft">
					</div>
					<div class="button-div">
						<input type="button" value="保存/上書き保存" id="edit-article-display--input--button--save">
					</div>
				</div>
			</div>
			<div class="editor-result--box">
				<div class="textarea--box">
					<textarea id="editor--textarea">

					</textarea>
				</div>
				<div class="result-display--box">

				</div>
			</div>
		</div>
	</template>
	<span id="console-ok"></span>
	<script defer src="https://jst.tshuto.com/tamura-first-load.js"></script>
	<header id="root-header">
		<section id="header-section">
			<div id="header-div-root-desktop" class="desktop-element">
				<nav id="header-items-box" class="root-nav">
					<div id="items-box-left-box">
						<a href="https://tshuto.com">
						</a>
					</div>
					<div id="items-box-center-box">
						<nav class="main-nav">
							<div class="main-nav-box">
								<div class="item-box deco-text">
									<a href="./?id=2026-0401-230000--base--home">
										<div class="item-box_icon-summary">Home</div>
									</a>
								</div>
								<div class="item-box deco-text">
									<a href="./?id=2026-0401-230000--base--articles">
										<div class="item-box_icon-summary">Article</div>
									</a>
								</div>
								<div class="item-box deco-text">
									<a href="./?id=2026-0401-230000--base--about">
										<div class="item-box_icon-summary">About</div>
									</a>
								</div>
							</div>
						</nav>
					</div>
					<div id="items-box-right-box">
						<nav class="main-nav">
							<div class="main-nav-box">
								<div class="item-box setting-general-box deco-text">
									<iframe class="icon-box_icon-img" src="https://svg.tshuto.com/blog/desktop/icon-setting.svg"></iframe>
									<div class="open-setting-display-button-element"></div>
								</div>
							</div>
						</nav>
					</div>
				</nav>
			</div>
			<div id="header-div-root-mobile" class="mobile-element">
				<nav id="header-items-box" class="root-nav">
					<!-- === idの命名規則が不安定・危険、作りが粗雑 === -->
					<div id="items-box-left-box">
						<nav class="main-nav">
							<div class="main-nav-box">
								<div class="item-box deco-text">
									<a href="./?id=2026-0401-230000--base--home">
										<div class="item-box_icon-box">
											<iframe class="icon-box_icon-img" src="https://svg.tshuto.com/blog/mobile/icon-home.svg"></iframe>
										</div>
										<div class="item-box_icon-summary">Home</div>
									</a>
								</div>
								<div class="item-box deco-text">
									<a href="./?id=2026-0401-230000--base--articles">
										<div class="item-box_icon-box">
											<iframe class="icon-box_icon-img" src="https://svg.tshuto.com/blog/mobile/icon-article.svg"></iframe>
										</div>
										<div class="item-box_icon-summary">Article</div>
									</a>
								</div>
								<div class="item-box deco-text">
									<a href="./?id=2026-0401-230000--base--about">
										<div class="item-box_icon-box">
											<iframe class="icon-box_icon-img" src="https://svg.tshuto.com/blog/mobile/icon-about.svg"></iframe>
										</div>
										<div class="item-box_icon-summary">About</div>
									</a>
								</div>
							</div>
						</nav>
					</div>
					<div id="items-box-right-box">
						<nav class="main-nav">
							<div class="main-nav-box">
								<div class="item-box deco-text">
									<iframe class="icon-box_icon-img" src="https://svg.tshuto.com/blog/mobile/icon-menu.svg"></iframe>
									<div class="open-setting-display-button-element"></div>
								</div>
							</div>
						</nav>
					</div>
				</nav>
			</div>
		</section>
	</header>
	<section id="setting-display-section" class="display-section background-blur" data-display-open="false" data-mydef--set-by-script="false">
		<div id="setting-display-div-main" class="display-section--div-main import-template-append" template-id-data="display-template" template-id-args="設定 %_ID:display-setting-template settings true"></div>
	</section>
	<section id="alert-display-section" class="display-section background-blur" data-display-open="false" data-mydef--set-by-script="false">
		<div id="alert-display-div-main" class="display-section--div-main import-template-append" template-id-data="display-template" template-id-args="警告 %_ID:display-alert-template alert false"></div>
	</section>
	<section id="confirm-display-section" class="display-section background-blur" data-display-open="false" data-mydef--set-by-script="false">
		<div id="confirm-display-div-main" class="display-section--div-main import-template-append" template-id-data="display-template" template-id-args="確認 %_ID:display-confirm-template confirm false"></div>
	</section>
	<section id="edit-article-display-section" class="display-section background-blur" data-display-open="false" data-mydef--set-by-script="false">
		<div id="edit-article-display-div-main" class="display-section--div-main import-template-append" template-id-data="edit-article-display-template" template-id-args=""></div>
	</section>
	<div id="root">
		<main id="root-main">
			<section id="main-section">
				<div id="main-contentsbox-root">
					<div class="main-contentsbox">
						コンテンツを読み込み中・・・
					</div>
				</div>
			</section>
			<section id="all-articles-display-section" class="display-section" data-display-open="false" data-mydef--set-by-script="false">
				<div id="all-articles-display-div-main" class="display-section--div-main import-template-append" template-id-data="all-articles-display-template" template-id-args=""></div>
			</section>
			<section id="create-new-article-setting-display-section" class="display-section" data-display-open="false" data-mydef--set-by-script="false">
				<div id="create-new-article-setting-display-div-main" class="display-section--div-main import-template-append" template-id-data="create-new-article-display-template" template-id-args=""></div>
			</section>
		</main>
		<footer id="root-footer">
			<section id="footer-section">
				<br>
				<div>当サイトは一切のJSフレームワークを使用していません</div>
			</section>
		</footer>
	</div>
	<script defer src=" https://link.tshuto.com/src/js/blog/loader.js"></script>
</body>

</html>
