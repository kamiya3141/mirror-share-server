<!doctype html>
<html lang="ja">
	<head>
		<meta charset="utf-8" />
		<title>ブログ - TSHUTO</title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="description" content="このサイトはTSHUTO.COMのブログサイトです" />
		<meta name="color-scheme" content="light dark" />
		<link rel="stylesheet" href="https://css.tshuto.com/base.css" />
		<link rel="stylesheet" href="https://css.tshuto.com/utils/utils.css" />
		<link rel="stylesheet" href="./src/css/style.css" />

		<!--
	<script defer src="https://share.tshuto.com/All.js"></script>
	-->
	</head>

	<body>
		<span id="console-ok"></span>
		<div id="root">
			<main id="root-main">
				<section id="main-section">
					<div id="main-contentsbox-root">
						<div class="main-contentsbox" data-mydef--markdown-design--name="default" data-mydef--markdown-design--important="false">コンテンツを読み込み中・・・</div>
					</div>
				</section>
				<section id="all-articles-display-section" class="display-section" data-display-open="false" data-mydef--set-by-script="false">
					<div id="all-articles-display-div-main" class="display-section--div-main import-template-append" template-id-data="all-articles-display-template" template-id-args=""></div>
				</section>
				<section id="create-new-article-setting-display-section" class="display-section" data-display-open="false" data-mydef--set-by-script="false">
					<div id="create-new-article-setting-display-div-main" class="display-section--div-main import-template-append" template-id-data="create-new-article-setting-display-template" template-id-args=""></div>
				</section>
			</main>
			<footer id="root-footer">
				<section id="footer-section">
					<br />
					<div>当サイトは一切のJSフレームワークを使用していません</div>
				</section>
			</footer>
		</div>
		<script defer src="https://jst.tshuto.com/tamura-first-load.js"></script>
		<script defer src="./src/js/local-render.js"></script>
		<script defer src="https://js.tshuto.com/utils/utils-render.js"></script>
		<script defer src="https://js.tshuto.com/utils/utils.js"></script>
		<script defer src="https://js.tshuto.com/utils/setup.js"></script>
		<script defer src="https://js.tshuto.com/utils/device-info.js"></script>
		<script defer src="https://js.tshuto.com/utils/utils-after.js"></script>
		<script defer src="https://link.tshuto.com/src/js/blog/loader.js"></script>
		<script defer src="./src/js/site-setting-info.js"></script>
		<script defer src="./src/js/after.js"></script>
		<script defer src="./src/js/display-all-articles.js"></script>
	</body>
</html>
