		<template id="all-articles-display-template">
			<div id="all-articles-main-contents">
				<div class="type-search--input--box">
					<input type="search" placeholder="検索ワードを入力" id="main--input--type-search" />
				</div>
				<div class="article-contents--box"></div>
			</div>
		</template>
		<template id="create-new-article-setting-display-template">
			<div id="create-new-article-main-contents">
				<form id="create-new-article--form">
					<div class="setting-info--box">
						<div class="input--box">
							<input type="text" placeholder="タイトル" name="title" required pattern=".+" />
						</div>
						<div class="input--box">
							<input type="text" placeholder="slug（更新・変更不可）" name="slug" required pattern="[A-Za-z0-9\-]+" />
						</div>
						<div class="input--box">
							<input type="text" placeholder="カテゴリ" name="category" required pattern="[A-Z\-]+" />
						</div>
						<div class="input--box">
							<input type="text" placeholder="タグ(,で区切る)" name="tags" required pattern="^\s*[^\[\]\{\}\\,']+\s*(,\s*[^\[\]\{\}\\,']+\s*)*$" />
						</div>
						<div class="input--box">
							<input type="text" placeholder="見出し" name="excerpt" required pattern=".+" />
						</div>
					</div>
					<div class="submit-button--box" data-mydef--create-new-article--submit-button-box--has-id="false" data-mydef--create-new-article--submit-button-box--article-type="article" data-mydef--create-new-article--submit-button-box--article-status="draft">
						<div class="input--box input-submit--box--has-id--true input-submit--box--status-published input-submit--box--status-privated input-submit--box--status-draft">
							<input type="submit" value="削除" name="parts--deleted" />
						</div>
						<div class="input--box input-submit--box--has-id--true input-submit--box--type-article input-submit--box--status-published input-submit--box--status-deleted">
							<input type="submit" value="下書き" name="parts--draft" />
						</div>
						<div class="input--box input-submit--box--has-id--true input-submit--box--type-article input-submit--box--status-published">
							<input type="submit" value="非公開" name="parts--privated" />
						</div>
						<div class="input--box input-submit--box--has-id--true input-submit--box--type-article input-submit--box--status-privated input-submit--box--status-draft">
							<input type="submit" value="公開" name="parts--published" />
						</div>
						<div class="input--box input-submit--box--has-id--true input-submit--box--type-article input-submit--box--status-published input-submit--box--status-privated input-submit--box--status-draft">
							<input type="submit" value="更新" name="parts--updated" />
						</div>
						<div class="input--box input-submit--box--has-id--false">
							<input type="submit" value="作成" name="parts--created" />
						</div>
					</div>
				</form>
			</div>
		</template>
		<template id="edit-article-display-template">
			<div id="edit-article-main-contents">
				<div class="control--box">
					<div class="extra-space"></div>
					<div class="button-div--box">
						<div class="button-div">
							<input type="button" value="バックアップ保存" id="edit-article-display--input--button--backup" />
						</div>
						<div class="button-div">
							<input type="button" value="下書き保存" id="edit-article-display--input--button--draft" />
						</div>
						<div class="button-div">
							<input type="button" value="投稿/上書き保存" id="edit-article-display--input--button--save" />
						</div>
					</div>
				</div>
				<div class="editor-result--box">
					<div class="textarea--box">
						<div id="editor--my-editor" data-mydef--my-editor--parent-element="inherit"></div>
						<textarea id="editor--textarea"></textarea>
					</div>
					<div class="result-display--box">
						<div class="result-display--root">
							<div class="main-contentsbox"></div>
						</div>
					</div>
				</div>
			</div>
		</template>
		<template id="setting-site-display-template">
			<div class="display-inner-contents" id="display-site-setting-main-contents-setting">

						</div>

							<div class="tab-bar--contents--item text-overflow-element" title="詳細設定">詳細設定</div>

							<div class="tab-bar--contents--item text-overflow-element" title="サイトの設定">サイトの設定</div>

						<div class="tab-bar--contents" id="tb--reset--setting-site-data">

				<div class="tab-contents-box">

							<div class="item-summary">MDの再生成</div>
							<div class="item-box">

							</div>
						</div>
						<div class="item-all-box">
							<div class="item-summary">MDのデザイン</div>
							<div class="item-box">
								<div class="item">
									<select id="setting-site-display--appearance--input-select--design-setting" class="allow-expand" data-mydef--set-by-script="false"></select>
								</div>
							</div>
						</div>
						<div class="item-all-box">
							<div class="item-summary">メインの背景色</div>
							<div class="item-box">
								<div class="item">
									<input type="color" id="setting-site-display--appearance--input-color--main-background-color" class="allow-expand" />
								</div>
							</div>
						</div>
						<div class="item-all-box">
							<div class="item-summary">メインの文字色</div>
							<div class="item-box">
								<div class="item">
									<input type="color" id="setting-site-display--appearance--input-color--main-text-color" class="allow-expand" />
								</div>
							</div>
						</div>
						<div class="item-all-box">
							<div class="item-summary">要素の背景色 1</div>
							<div class="item-box">
								<div class="item">
									<input type="color" id="setting-site-display--appearance--input-color--element-background-color-1" class="allow-expand" />
								</div>
							</div>
						</div>
						<div class="item-all-box">
							<div class="item-summary">要素の背景色 2</div>
							<div class="item-box">
								<div class="item">
									<input type="color" id="setting-site-display--appearance--input-color--element-background-color-2" class="allow-expand" />
								</div>
							</div>
						</div>
					</div>
					<div class="tab-contents-box--item" id="tc--specific">
						<div class="item-all-box">
							<div class="item-summary">背景色等を推奨値に上書きすることを許可しない</div>
							<div class="item-box">
								<div class="item import-template-append" template-id-data="toggle-switch-template" data-mydef--import-template-type="site-setting" template-id-args="site-setting--disallow-override-colors"></div>
							</div>
						</div>
						<div class="item-all-box">
							<div class="item-summary">設定画面の既定値</div>
							<div class="item-box">
								<div class="item">
									<select id="setting-site-display--specific--input-select--setting-site-display-init-item" class="allow-expand" data-mydef--set-by-script="false"></select>
								</div>
							</div>
						</div>
						<div class="item-all-box">
							<div class="item-summary">設定画面をリロード後に開くことを許可</div>
							<div class="item-box">
								<div class="item import-template-append" template-id-data="toggle-switch-template" data-mydef--import-template-type="site-setting" template-id-args="allow--opening--setting-site-display--after--reload"></div>
							</div>
						</div>
					</div>
					<div class="tab-contents-box--item" id="tc--setting-site-data">
						<div class="item-all-box">
							<div class="item-summary">ローカルストレージに設定を保存する</div>
							<div class="item-box">
								<div class="item import-template-append" template-id-data="toggle-switch-template" data-mydef--import-template-type="site-setting" template-id-args="save--setting-site-data--localstorage"></div>
							</div>
						</div>
					</div>
					<div class="tab-contents-box--item" id="tc--reset--setting-site-data">
						<div class="item-all-box">
							<div class="item-summary">サイトの設定値の初期化</div>
							<div class="item-box">
								<div class="item">
									<button class="allow-expand" onclick="javascript: resetSiteSettingInformationData();">実行</button>
								</div>
							</div>
						</div>
						<div class="item-all-box">
							<div class="item-summary">サイトの設定値を削除</div>
							<div class="item-box">
								<div class="item">
									<button class="allow-expand" onclick="javascript: removeSiteSettingInformationData();">実行</button>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</template>
