<!doctype html>
<html lang="ja">

<head>
	<meta charset="utf-8">
	<title>ブログ - TSHUTO</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="このサイトはTSHUTO.COMのブログサイトです">
	<meta name="color-scheme" content="light dark">
	<link rel="stylesheet" href="https://css.tshuto.com/awesome-font.css">
	<link rel="stylesheet" href="https://css.tshuto.com/base.css">
	<link rel="stylesheet" href="https://css.tshuto.com/utils/utils.css">
	<link rel="stylesheet" href="./src/css/style.css">
	<link rel="stylesheet" href="./src/css/markdown.css">
	<link rel="stylesheet" href="./src/css/all-articles-display.css">
	<link rel="stylesheet" href="./src/css/create-new-article-setting.css">
	<link rel="stylesheet" href="./src/css/edit-article-display.css">

	<!--
	<script defer src="https://share.tshuto.com/All.js"></script>
	-->
</head>

<body>
	<!--
	<script defer src="https://ld.tshuto.com/loading.js?2"></script>
	-->
	<span id="console-ok"></span>
	<script defer src="https://jst.tshuto.com/tamura-first-load.js"></script>
	<template id="all-articles-display-template">
		<div id="all-articles-main-contents">
			<div class="type-search--input--box">
				<input type="search" placeholder="検索ワードを入力" id="main--input--type-search">
			</div>
			<div class="article-contents--box">

			</div>
		</div>
	</template>
	<template id="create-new-article-setting-display-template">
		<div id="create-new-article-main-contents">
			<form id="create-new-article--form">
				<div class="setting-info--box">
					<div class="input--box">
						<input type="text" placeholder="タイトル" name="title" required pattern=".+">
					</div>
					<div class="input--box">
						<input type="text" placeholder="slug（更新・変更不可）" name="slug" required pattern="[A-Za-z0-9\-]+">
					</div>
					<div class="input--box">
						<input type="text" placeholder="カテゴリ" name="category" required pattern="[A-Z\-]+">
					</div>
					<div class="input--box">
						<input type="text" placeholder="タグ(,で区切る)" name="tags" required pattern="^\s*[^\[\]\{\}\\,']+\s*(,\s*[^\[\]\{\}\\,']+\s*)*$">
					</div>
					<div class="input--box">
						<input type="text" placeholder="見出し" name="excerpt" required pattern=".+">
					</div>
				</div>
				<div class="submit-button--box" data-mydef--create-new-article--submit-button-box--has-id="false" data-mydef--create-new-article--submit-button-box--article-type="article" data-mydef--create-new-article--submit-button-box--article-status="draft">
					<div class="input--box input-submit--box--has-id--true input-submit--box--status-published input-submit--box--status-privated input-submit--box--status-draft">
						<input type="submit" value="削除" name="parts--deleted">
					</div>
					<div class="input--box input-submit--box--has-id--true input-submit--box--type-article input-submit--box--status-published input-submit--box--status-deleted">
						<input type="submit" value="下書き" name="parts--draft">
					</div>
					<div class="input--box input-submit--box--has-id--true input-submit--box--type-article input-submit--box--status-published">
						<input type="submit" value="非公開" name="parts--privated">
					</div>
					<div class="input--box input-submit--box--has-id--true input-submit--box--type-article input-submit--box--status-privated input-submit--box--status-draft">
						<input type="submit" value="公開" name="parts--published">
					</div>
					<div class="input--box input-submit--box--has-id--true input-submit--box--type-article input-submit--box--status-published input-submit--box--status-privated input-submit--box--status-draft">
						<input type="submit" value="更新" name="parts--updated">
					</div>
					<div class="input--box input-submit--box--has-id--false">
						<input type="submit" value="作成" name="parts--created">
					</div>
				</div>
			</form>
		</div>
	</template>
	<template id="edit-article-display-template">
		<div id="edit-article-main-contents">
			<div class="control--box">
				<div class="extra-space"></div>
				<div class="button-div--box">
					<div class="button-div">
						<input type="button" value="バックアップ保存" id="edit-article-display--input--button--backup">
					</div>
					<div class="button-div">
						<input type="button" value="下書き保存" id="edit-article-display--input--button--draft">
					</div>
					<div class="button-div">
						<input type="button" value="投稿/上書き保存" id="edit-article-display--input--button--save">
					</div>
				</div>
			</div>
			<div class="editor-result--box">
				<div class="textarea--box">
					<textarea id="editor--textarea"></textarea>
				</div>
				<div class="result-display--box">
					<div class="result-display--root">
						<div class="main-contentsbox"></div>
					</div>
				</div>
			</div>
		</div>
	</template>
	<header id="root-header">
		<section id="header-section">
			<div id="header-div-root-desktop" class="desktop-element">
				<nav id="header-items-box" class="root-nav">
					<div id="items-box-left-box">
						<a href="https://tshuto.com">
						</a>
					</div>
					<div id="items-box-center-box">
						<nav class="main-nav">
							<div class="main-nav-box">
								<div class="item-box deco-text">
									<a href="./?id=20260401230000--home">
										<div class="item-box_icon-summary">Home</div>
									</a>
								</div>
								<div class="item-box deco-text">
									<a href="./?id=20260401230000--articles">
										<div class="item-box_icon-summary">Article</div>
									</a>
								</div>
								<div class="item-box deco-text">
									<a href="./?id=20260401230000--about">
										<div class="item-box_icon-summary">About</div>
									</a>
								</div>
							</div>
						</nav>
					</div>
					<div id="items-box-right-box">
						<nav class="main-nav">
							<div class="main-nav-box">
								<div class="item-box setting-general-box deco-text">
									<iframe class="icon-box_icon-img" src="https://svg.tshuto.com/blog/desktop/icon-setting.svg"></iframe>
									<div class="open-setting-display-button-element"></div>
								</div>
							</div>
						</nav>
					</div>
				</nav>
			</div>
			<div id="header-div-root-mobile" class="mobile-element">
				<nav id="header-items-box" class="root-nav">
					<!-- === idの命名規則が不安定・危険、作りが粗雑 === -->
					<div id="items-box-left-box">
						<nav class="main-nav">
							<div class="main-nav-box">
								<div class="item-box deco-text">
									<a href="./?id=20260401230000--home">
										<div class="item-box_icon-box">
											<iframe class="icon-box_icon-img" src="https://svg.tshuto.com/blog/mobile/icon-home.svg"></iframe>
										</div>
										<div class="item-box_icon-summary">Home</div>
									</a>
								</div>
								<div class="item-box deco-text">
									<a href="./?id=20260401230000--articles">
										<div class="item-box_icon-box">
											<iframe class="icon-box_icon-img" src="https://svg.tshuto.com/blog/mobile/icon-article.svg"></iframe>
										</div>
										<div class="item-box_icon-summary">Article</div>
									</a>
								</div>
								<div class="item-box deco-text">
									<a href="./?id=20260401230000--about">
										<div class="item-box_icon-box">
											<iframe class="icon-box_icon-img" src="https://svg.tshuto.com/blog/mobile/icon-about.svg"></iframe>
										</div>
										<div class="item-box_icon-summary">About</div>
									</a>
								</div>
							</div>
						</nav>
					</div>
					<div id="items-box-right-box">
						<nav class="main-nav">
							<div class="main-nav-box">
								<div class="item-box deco-text">
									<iframe class="icon-box_icon-img" src="https://svg.tshuto.com/blog/mobile/icon-menu.svg"></iframe>
									<div class="open-setting-display-button-element"></div>
								</div>
							</div>
						</nav>
					</div>
				</nav>
			</div>
		</section>
	</header>
	<section id="edit-article-display-section" class="display-section background-blur important-section-0" data-display-open="false" data-mydef--set-by-script="false">
		<div id="edit-article-display-div-main" class="display-section--div-main import-template-append" template-id-data="edit-article-display-template" template-id-args=""></div>
	</section>
	<div id="root">
		<main id="root-main">
			<section id="main-section">
				<div id="main-contentsbox-root">
					<div class="main-contentsbox">
						コンテンツを読み込み中・・・
					</div>
				</div>
			</section>
			<section id="all-articles-display-section" class="display-section" data-display-open="false" data-mydef--set-by-script="false">
				<div id="all-articles-display-div-main" class="display-section--div-main import-template-append" template-id-data="all-articles-display-template" template-id-args=""></div>
			</section>
			<section id="create-new-article-setting-display-section" class="display-section" data-display-open="false" data-mydef--set-by-script="false">
				<div id="create-new-article-setting-display-div-main" class="display-section--div-main import-template-append" template-id-data="create-new-article-setting-display-template" template-id-args=""></div>
			</section>
		</main>
		<footer id="root-footer">
			<section id="footer-section">
				<br>
				<div>当サイトは一切のJSフレームワークを使用していません</div>
			</section>
		</footer>
	</div>
	<script defer src="https://js.tshuto.com/utils/utils.js"></script>
	<script defer src="https://js.tshuto.com/utils/setup.js"></script>
	<script defer src="https://js.tshuto.com/utils/device-info.js"></script>
	<script defer src="https://js.tshuto.com/utils/utils-after.js"></script>
	<script defer src="https://link.tshuto.com/src/js/blog/loader.js"></script>
	<script defer src="./src/js/after.js"></script>
</body>

</html>
