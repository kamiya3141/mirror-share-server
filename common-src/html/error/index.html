<!doctype html>
<html lang="ja">

<head>
	<title>-:-ERROR-CODE-:- Error</title>
	<meta charset="utf-8" />
	<script defer src="https://kamiya3141.github.io/mirror-share-server/common-src/javascript/def/Message/1.2.1/Message.js"></script>
	<!--
	<script defer src="https://share.tshuto.com/common-src/javascript/def/Message/1.2.1/Message.js"></script>
	<script defer src="https://share.tshuto.com/All.js"></script>
	-->
</head>

<body style="background-color:black;">
	<div id="console-ok"></div>
	<script defer src="https://kamiya3141.github.io/mirror-share-server/common-src/javascript/tamura/tamura-first-load.js"></script>
	<ts-message class="alert" color-type="alert">
		<div href="https://tshuto.com">
			<h1>Access Error !!</h1><br>
			<h2 id="error-code-element">Error Code : -:-ERROR-CODE-:-</h2><br>
			<h3 id="error-word-element">-:-ERROR-WORD-:-</h3><br>
			<h4>(type: alert)</h4><br>
		</div>
	</ts-message>
	<script>
		const getStringWithReplaceSplitWord = word => `-:-${word}-:-`;
		const currentUrlParams = new URL(window.location.toString()).searchParams;
		[
			{
				"word": "error-code",
				"function": (wd, val) => {
					wd = String(wd).toUpperCase();

					let ttl = document.title;
					document.title = ttl.replace(getStringWithReplaceSplitWord(wd), val);

					let ec_elem = document.getElementById("error-code-element");
					if (ec_elem)
						ec_elem.innerHTML = ec_elem.replace(getStringWithReplaceSplitWord(wd), val);
				}
			},
			{
				"word": "error-word",
				"function": (wd, val) => {
					wd = String(wd).toUpperCase();

					let ew_elem = document.getElementById("error-word-element");
					if (ew_elem)
						ew_elem.innerHTML = ew_elem.replace(getStringWithReplaceSplitWord(wd), val);
				}
			}
		].forEach(err_key => {
			if (currentUrlParams.get(err_key["word"]))
				err_key["function"](err_key["word"], currentUrlParams.get(err_key["word"]));
		});
	</script>
</body>

</html>
