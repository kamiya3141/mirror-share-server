<!doctype html>
<html lang="ja">

<head>
	<meta charset="utf-8" />
	<title>エディターテストのテスト</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="エディターテストのテスト">
	<style>
		.toggle_button {
			--tgl-w: 25vw;
			--tgl-h: calc(var(--tgl-w) * 35 / 75);
			--tgl-r: calc(var(--tgl-w) * 40 / 75);

			position: relative;
			width: var(--tgl-w);
			height: var(--tgl-h);
			margin: auto;

			&>.toggle_input {
				position: absolute;
				width: 100%;
				height: 100%;
				opacity: 0;
				cursor: pointer;

				&+.toggle_label {
					width: var(--tgl-w);
					height: var(--tgl-h);
					background: #ccc;
					border-radius: var(--tgl-r);
					display: inline-block;
					transition: background-color 0.4s;
					position: relative;

					&::after {
						content: "";
						position: absolute;
						width: var(--tgl-h);
						height: var(--tgl-h);
						background: #fff;
						border-radius: 50%;
						top: 0;
						left: 0;
						transition: left 0.4s;
					}
				}

				&:checked+.toggle_label {
					background-color: #4BD865;

					&::after {
						left: var(--tgl-r);
					}
				}
			}
		}
	</style>
</head>

<body>
	<script defer src="https://jst.tshuto.com/tamura0.js"></script>
	<div class="toggle_button">
		<input id="toggle" class="toggle_input" type="checkbox" />
		<label for="toggle" class="toggle_label"></label>
	</div>
</body>

</html>
