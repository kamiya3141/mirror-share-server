<!doctype html>
<html lang="ja">

<head>
	<meta charset="utf-8" />
	<title>エディターテスト</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="エディター群だお">
	<link rel="stylesheet" data-name="vs/editor/editor.main" href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/editor/editor.main.min.css" />
	<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/loader.min.js"></script>
	<link rel="stylesheet" href="./src/css/style.css">
</head>

<body>
	<span id="console-ok"></span>
	<!--
	<script defer src="https://ld.tshuto.com/loading.js?2"></script>
	-->
	<script defer src="https://jst.tshuto.com/tamura.js"></script>
	<div id="root">
		<div id="sandbox-root">
			<div id="code-body"></div>
			<iframe id="sandbox-iframe" srcdoc='
						<!doctype html>
						<html lang="ja">
						<head>
							<meta charset="utf-8">
							<title>JavaScript-TEST</title>
							<meta name="viewport" content="width=device-width, initial-scale=1">
							<meta name="description" content="JavaScriptテストページ">
							<style>
								* {
									color: inherit;
									background-color: inherit;
								}
							</style>
						</head>
						
						<body></body>
						</html>
			'></iframe>
		</div>
		<div id="sandbox-bottom-root">
			<div id="console-root">
				<p class="root-title">Console:</p>
				<div class="root-body" id="console-result-body">
					<div id="console-result"></div>
				</div>
			</div>
			<div id="setting-root">
				<p class="root-title">Setting:</p>
				<div class="root-body" id="setting-body">
					<div id="setting-box"></div>
				</div>
			</div>
		</div>
	</div>
</body>

</html>
