<!doctype html>
<html lang="ja" class="">
	<head>
		<meta charset="utf-8" />
		<title>JavaScriptテスト</title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="description" content="管理者のためのHTML, CSSテスト用のエディタです" />
		<meta name="color-scheme" content="light dark" />
		<link rel="stylesheet" data-name="vs/editor/editor.main" href="https://unpkg.com/monaco-editor@latest/min/vs/editor/editor.main.css" />
		<script src="https://unpkg.com/monaco-editor@latest/min/vs/loader.js"></script>
		<link rel="stylesheet" href="https://css.tshuto.com/All.css" />
		<!--
		<link rel="stylesheet" href="https://css.tshuto.com/base.css" />
		<link rel="stylesheet" href="https://css.tshuto.com/utils/utils.css" />
		-->
		<link rel="stylesheet" href="./src/css/style.css" />
	</head>

	<body>
		<!--
	<script defer src="https://ld.tshuto.com/loading.js?2"></script>
	-->
		<span id="console-ok"></span>
		<script defer src="https://jst.tshuto.com/tamura-first-load.js"></script>
		<script defer src="https://js.tshuto.com/utils/utils-render.js"></script>
		<script defer src="https://js.tshuto.com/utils/utils.js"></script>
		<script defer src="https://js.tshuto.com/utils/setup.js"></script>
		<script defer src="https://js.tshuto.com/utils/device-info.js"></script>
		<script defer src="https://js.tshuto.com/utils/utils-after.js"></script>
		<script defer src="./src/js/script.js"></script>
		<div id="root">
			<div id="title-root">
				<div id="title-body"></div>
				<div id="preview-title-body">preview</div>
			</div>
			<div id="contents-root">
				<div id="sandbox-root" class="utils--org--element">
					<div>
						<div id="code-body"></div>
					</div>
					<iframe id="sandbox-iframe" class="pointer-events-all" src="./src/html/iframe-root.html"></iframe>
				</div>
				<div id="sandbox-bottom-root">
					<div id="console-root">
						<div>
							<div id="test-debug-id" class="root-title">Console：</div>
							<div class="root-body" id="console-result-body">
								<div id="console-result" class="body-children"></div>
							</div>
						</div>
					</div>
					<div id="setting-root">
						<div>
							<div class="root-title">ページ設定：</div>
							<div class="root-body">
								<section>
									<div class="main-contents-title body-children-group-title">
										<div>エディターの設定：</div>
									</div>
									<div class="main-contents-body body-children-group-body">
										<div class="body-children">
											<div class="main-contents-title body-children-title">インデントにタブを使用：</div>
											<select id="editor-setting-use-tab-set-sel" class="main-contents-body">
												<option value="tab" selected>使用する</option>
												<option value="space">使用しない</option>
											</select>
										</div>
										<div class="body-children">
											<div class="main-contents-title body-children-title">タブのサイズ：</div>
											<select id="editor-setting-tab-size-set-sel" class="main-contents-body"></select>
										</div>
										<div class="body-children">
											<div class="main-contents-title body-children-title">オートインデント：</div>
											<select id="editor-setting-auto-indent-set-sel" class="main-contents-body body-children-body">
												<option value="on" selected>オン</option>
												<option value="off">オフ</option>
											</select>
										</div>
									</div>
								</section>
								<section>
									<div class="main-contents-title body-children-group-title">
										<div>テーマの設定：</div>
									</div>
									<div class="main-contents-body body-children-group-body">
										<div class="body-children">
											<div class="main-contents-title body-children-title">エディターのテーマ：</div>
											<select id="editor-theme-set-sel" class="main-contents-body"></select>
										</div>
										<div class="body-children">
											<div class="main-contents-title body-children-title">ページのテーマ：</div>
											<select id="page-theme-set-sel" class="main-contents-body">
												<option value="light">ライト</option>
												<option value="dark">ダーク</option>
												<option value="system" selected>システム</option>
											</select>
										</div>
										<div class="body-children">
											<div class="main-contents-title body-children-title">エディターのテーマ制限：</div>
											<select id="restrict-theme-set-sel" class="main-contents-body body-children-body">
												<option value="true">ページのテーマに制限する</option>
												<option value="false" selected>ページのテーマに制限しない</option>
											</select>
										</div>
									</div>
								</section>
								<section>
									<div class="main-contents-title body-children-group-title">
										<div>フォントの設定：</div>
									</div>
									<div class="main-contents-body body-children-group-body">
										<div class="body-children">
											<div class="main-contents-title body-children-title">エディターのフォント：</div>
											<select id="editor-font-set-sel" class="main-contents-body"></select>
										</div>
										<div class="body-children">
											<div class="main-contents-title body-children-title">ページのフォント：</div>
											<select id="page-font-set-sel" class="main-contents-body"></select>
										</div>
										<div class="body-children void-class"></div>
									</div>
								</section>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</body>
</html>
