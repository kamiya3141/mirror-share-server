<!doctype html>
<html lang="ja">

<head>
	<meta charset="utf-8">
	<title>StreamDeck-HTML</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="StreamDeck HTML版">
	<link rel="manifest" href="./src/json/manifest.json">
	<link rel="stylesheet" href="https://css.tshuto.com/base.css">
	<link rel="stylesheet" href="https://css.tshuto.com/utils/utils.css">
	<link rel="stylesheet" href="./src/css/style.css">
</head>

<body>
	<span id="console-ok"></span>
	<div id="root">
		<section id="main-contents">
			<div id="contents--title-box">
				<div class="title-element"></div>
			</div>
			<div id="contents--button-box">
				<div id="button-box--item-box"></div>
				<div id="button-box--task-bar">
					<button type="button" id="move-page--prev" onclick="javascript:MoveToPage(false)">
						<img src="https://svg.tshuto.com/streamdeck/arrow.svg">
					</button>
					<button type="button" class="open-setting-display-button-element">
						<img src="https://svg.tshuto.com/blog/desktop/icon-setting.svg">
					</button>
					<button type="button" onclick="javascript:MoveToUpDownDirectory()">
						<img src="https://svg.tshuto.com/streamdeck/arrow.svg" class="img-deg--90">
					</button>
					<button type="button" onclick="javascript:window.location.reload()">
						<img src="https://file-nextcloud.tshuto.com/image/icon-png/reload.png">
					</button>
					<button type="button" id="move-page--next" onclick="javascript:MoveToPage(true)">
						<img src="https://svg.tshuto.com/streamdeck/arrow.svg" class="rl-reverse">
					</button>
				</div>
			</div>
		</section>
	</div>
	<!--共通ファイル読み込み用スクリプト読み込み-->
	<script defer src="https://jst.tshuto.com/tamura-first-load.js"></script>
	<script defer src="https://js.tshuto.com/utils/utils.js"></script>
	<script defer src="https://js.tshuto.com/utils/setup.js"></script>
	<script defer src="https://js.tshuto.com/utils/device-info.js"></script>
	<script defer src="https://js.tshuto.com/utils/utils-after.js"></script>
	<script defer src="./src/js/setup.js"></script>
	<script defer src="./src/js/script.js"></script>
</body>

</html>
